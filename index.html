<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Poor Fantasy</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header id="menubar">
      <nav>
        <div class="menu">
          <button class="menu-btn">Game</button>
          <div class="menu-panel">
            <button id="menu-new-game">New game…</button>
            <button data-command='{"type":"openParty"}' title="P"><span><u>P</u>arty…</span></button>
            <button data-command='{"type":"partyScreen"}'>Party roster…</button>
            <button data-command='{"type":"openPack"}' title="K"><span>Pac<u>k</u>…</span></button>
            <button id="menu-journal" title="J"><span>Quest <u>j</u>ournal…</span></button>
            <hr />
            <button data-command='{"type":"worldMap"}'>World map</button>
            <button data-command='{"type":"newFight"}'>New test fight</button>
            <button data-command='{"type":"restart"}'>Restart this fight <small>(same dice)</small></button>
            <button data-command='{"type":"undo"}'>Rewind last action <small>Backspace</small></button>
            <hr />
            <button id="menu-saves">Save / load game…</button>
          </div>
        </div>
        <div class="menu">
          <button class="menu-btn">Preferences</button>
          <div class="menu-panel">
            <label><input type="checkbox" id="pref-grid" /> Grid lines</label>
            <label title="Ends the turn once your character has attacked or helped an ally (movement left is given up), or has no moves and nothing in reach."><input type="checkbox" id="pref-autoend" /> End turn automatically after acting</label>
            <label
              >Text size
              <select id="pref-text">
                <option value="small">Small</option>
                <option value="normal">Normal</option>
                <option value="large">Large</option>
              </select>
            </label>
            <label title="Where the party panel (and the combat card) sits on every screen. Narrow screens always stack it above the game."
              >Side panel
              <select id="pref-panel">
                <option value="right">Right</option>
                <option value="left">Left</option>
              </select>
            </label>
            <label title="What happens to fallen characters when the party flees over a map edge. Applies from the next fight."
              >Difficulty
              <select id="pref-difficulty">
                <option value="hard">Hard — the fallen are left behind</option>
                <option value="normal">Normal — carry the fallen out</option>
                <option value="casual">Casual — the whole party escapes</option>
              </select>
            </label>
            <hr />
            <label class="disabled"><input type="checkbox" disabled /> Sound <small>coming — DND-33</small></label>
            <label class="disabled"><input type="checkbox" disabled /> Music <small>coming — DND-34</small></label>
            <label class="disabled"><input type="checkbox" disabled /> Dice animation <small>coming — DND-32</small></label>
          </div>
        </div>
        <div class="menu">
          <button class="menu-btn">About</button>
          <div class="menu-panel">
            <button id="open-controls">Controls</button>
            <button id="open-about">About Poor Fantasy</button>
          </div>
        </div>
      </nav>
      <span id="status">Loading…</span>
    </header>

    <main>
      <aside id="left">
        <section id="card" aria-live="polite"></section>
        <div id="turn-buttons">
          <button data-command='{"type":"endTurn"}' title="Space">End turn <small>␣</small></button>
          <button data-command='{"type":"undo"}' title="Backspace or U">⟲ Rewind <small>U</small></button>
          <button id="flee-btn" data-command='{"type":"flee"}' title="F, or step off the map edge"><span>⇥ <u>F</u>lee</span></button>
        </div>
        <ol id="turn-order" aria-label="Turn order" hidden></ol>
      </aside>
      <div id="stage">
        <div id="game"></div>
        <div id="banner" class="overlay" hidden>
          <h1 id="banner-title"></h1>
          <p id="banner-sub"></p>
          <div class="row">
            <button data-command='{"type":"newFight"}'>Fight again</button>
            <button data-command='{"type":"endFight"}'>Continue</button>
          </div>
        </div>
      </div>
      <section id="log" aria-live="polite"></section>
      <section id="party-screen"></section>
    </main>

    <!-- On-screen pad: shown on touch devices only -->
    <footer id="touchpad">
      <button data-command='{"type":"move","dir":"nw"}' aria-label="Move north-west">↖</button>
      <button data-command='{"type":"move","dir":"n"}' aria-label="Move north">↑</button>
      <button data-command='{"type":"move","dir":"ne"}' aria-label="Move north-east">↗</button>
      <button data-command='{"type":"move","dir":"w"}' aria-label="Move west">←</button>
      <button data-command='{"type":"move","dir":"e"}' aria-label="Move east">→</button>
      <button data-command='{"type":"move","dir":"sw"}' aria-label="Move south-west">↙</button>
      <button data-command='{"type":"move","dir":"s"}' aria-label="Move south">↓</button>
      <button data-command='{"type":"move","dir":"se"}' aria-label="Move south-east">↘</button>
    </footer>

    <dialog id="popup-frame" class="popup-frame"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
