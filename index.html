<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Poor Fantasy</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header><span id="status">Loading…</span></header>
    <main>
      <aside id="left">
        <section id="card" aria-live="polite"></section>
        <button data-command='{"type":"endTurn"}'>End turn</button>
        <button data-command='{"type":"undo"}' title="Backspace or U">⟲ Rewind (debug)</button>
        <button data-command='{"type":"confirm"}'>Replay</button>
      </aside>
      <div id="stage">
        <div id="game"></div>
        <div id="banner" hidden>
          <h1 id="banner-title"></h1>
          <p id="banner-sub"></p>
          <button data-command='{"type":"confirm"}'>Fight again</button>
        </div>
      </div>
      <section id="log" aria-live="polite"></section>
    </main>
    <footer>
      <button data-command='{"type":"move","dir":"nw"}' aria-label="Move north-west">↖</button>
      <button data-command='{"type":"move","dir":"n"}' aria-label="Move north">↑</button>
      <button data-command='{"type":"move","dir":"ne"}' aria-label="Move north-east">↗</button>
      <button data-command='{"type":"move","dir":"w"}' aria-label="Move west">←</button>
      <button data-command='{"type":"move","dir":"e"}' aria-label="Move east">→</button>
      <button data-command='{"type":"move","dir":"sw"}' aria-label="Move south-west">↙</button>
      <button data-command='{"type":"move","dir":"s"}' aria-label="Move south">↓</button>
      <button data-command='{"type":"move","dir":"se"}' aria-label="Move south-east">↘</button>
      <span class="hint">Click/tap a shaded square to move · click an enemy to walk up and attack · WASD / arrows / numpad step · Q E Z C diagonals · Space ends turn early · Backspace/U rewinds</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
